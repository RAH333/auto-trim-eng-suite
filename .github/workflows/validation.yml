name: Automotive Engineering Validation Check

on: [push, pull_request]

jobs:
  validate-design-rules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Engineering Python Environment
      uses: actions/setup-python@v4
      with:
        python-node-version: '3.10'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Execute Automated Structural Engineering Tests
      run: |
        pytest tests/
        
# Automates strict validation gates for engineering configurations on every commit code path change.
